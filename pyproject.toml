[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spherex-download"
version = "0.1.0"
description = "Standalone SPHEREx FITS downloads and PNG conversion"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "astropy>=6", "numpy>=1.26", "Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
spherex-download = "download:main"
spherex-progressive = "progressive:main"
spherex-png = "fits_to_png:main"

[tool.setuptools]
py-modules = ["download", "progressive", "fits_to_png", "downloading"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
